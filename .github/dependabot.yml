# Dependabot version updates. Security updates are separate and still arrive
# as their own PRs whenever an advisory affects a dependency.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # One weekly PR for all minor and patch bumps, so react and react-dom
    # (and similar pairs) move together instead of failing separately.
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Major upgrades need a planned migration; skip them here.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
